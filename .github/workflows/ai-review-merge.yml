name: AI Review & Auto-Merge

# 审查逻辑在组织级复用工作流里：SNNLU/.github/.github/workflows/ai-review-merge.yml
# 本仓库只保留调用者，改逻辑请去那个仓库改（一处生效）。
#
# 前置条件：仓库需开启 Allow auto-merge，且 ruleset 中要求了状态检查。
# 所需 secret：LLM_API_KEY（必填）、BOT_TOKEN（建议，独立身份的 token）。
# 可选 variable：LLM_BASE_URL、LLM_MODEL。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    uses: SNNLU/.github/.github/workflows/ai-review-merge.yml@main
    secrets: inherit
