name: 部署（合并到 main 后生成静态站并发布到 GitHub Pages）

on:
  push:
    branches: [main]
  # 需要手动重跑部署时：Actions → 本工作流 → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署串行执行、不互相取消（避免两次部署交错把线上搞成半新半旧）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 ci.yml 保持一致
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态站
        run: npm run generate

      - name: 校验产物
        run: test -f .output/public/index.html

      - name: 打包给 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
